[project]
name = "finsight"
version = "0.1.0"
description = "Agentic personal finance analyst built with LangChain, LangGraph, and Pydantic"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=0.2.0",
]
vectorstore = [
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]
